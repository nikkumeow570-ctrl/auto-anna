name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      # The Android app shows the same web app, bundled inside the APK.
      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          sed -i "s/var BUILD=\"dev\"/var BUILD=\"${{ github.run_number }}\"/" index.html
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js -o android/app/src/main/assets/www/qrcode.js || echo 'QR library not bundled, the app will load it from the web'
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png android/app/src/main/assets/www/

      # A real signing key is required. Run android/make-keystore.sh once (see README-PRODUCTION.md).
      # It stores these repository secrets: KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing key. Run android/make-keystore.sh once, then run this workflow again."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK and Play bundle (AAB)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon

      - name: Name the files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk auto-anna.apk
          cp android/app/build/outputs/bundle/release/app-release.aab auto-anna.aab
          # Show the signing certificate fingerprint, so you can check it never changes between releases.
          keytool -printcert -jarfile auto-anna.apk | grep -E "Owner|SHA256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: auto-anna-release
          path: |
            auto-anna.apk
            auto-anna.aab

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Auto Anna 1.0.${{ github.run_number }}
          files: auto-anna.apk
